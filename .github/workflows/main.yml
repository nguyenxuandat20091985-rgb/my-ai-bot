name: AI Product Review Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'   # 07:00 sáng giờ Việt Nam

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run AI Product Review Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ACCESSTRADE_API_TOKEN: ${{ secrets.ACCESSTRADE_API_TOKEN }}
          ACCESSTRADE_SITE_ID: ${{ secrets.ACCESSTRADE_SITE_ID }}
          ACCESSTRADE_CAMPAIGN_ID: ${{ secrets.ACCESSTRADE_CAMPAIGN_ID }}
          SAFE_MODE: "true"
          AUTO_PUBLISH: "true"
        run: python bot_v1.py
      - name: Show what bot generated
        run: |
          echo "=== Files changed ==="
          git status --short || true
          echo "=== bai files ==="
          ls -la bai-*.html 2>/dev/null || echo "(no root bai-*.html)"
          ls -la docs/bai-*.html 2>/dev/null || echo "(no docs/bai-*.html)"
          echo "=== result.txt head ==="
          head -20 result.txt 2>/dev/null || true
      - name: Commit & Push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/ data/ result.txt index.html || true
          git add -f bai-*.html docs/bai-*.html 2>/dev/null || true
          git status --short
          if git diff --cached --quiet; then
            echo "WARNING: No changes to commit after bot run"
          else
            git commit -m "Auto update AI product review $(date -u +%Y-%m-%d)"
            git push
            echo "Pushed successfully"
          fi
