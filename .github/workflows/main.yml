name: AI Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'   # 07:00 sáng giờ Việt Nam

jobs:
  run-ai:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Bot V1.0
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SAFE_MODE: "true"
          AUTO_PUBLISH: "true"          # Bật publish khi nội dung đạt chất lượng
        run: python bot_v1.py

      - name: Commit & Push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ result.txt bai-*.html index.html data/ || true
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto update AI result $(date -u +%Y-%m-%d)" &&
            git push
          )