name: AI Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'   # 07:00 sáng giờ Việt Nam (UTC 00:00)

jobs:
  run-ai:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Bot V1.0
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ACCESSTRADE_API_TOKEN: ${{ secrets.ACCESSTRADE_API_TOKEN }}
          ACCESSTRADE_CAMPAIGN_ID: ${{ secrets.ACCESSTRADE_CAMPAIGN_ID }}
          SAFE_MODE: "true"
          AUTO_PUBLISH: "true"
        run: python bot_v1.py

      - name: Commit & Push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/ || true
          git add result.txt index.html || true
          git add data/ || true
          git add bai-*.html 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "✅ Không có thay đổi mới – bỏ qua commit"
          else
            git commit -m "Auto update AI result $(date -u +%Y-%m-%d)" || true
            git pull --rebase origin main || git pull --rebase --autostash origin main || true
            git push origin HEAD:main
            echo "✅ Đã commit & push thành công"
          fi