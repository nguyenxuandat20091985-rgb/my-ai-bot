name: AI Product Review Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'   # 07:00 sáng giờ Việt Nam

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run AI Product Review Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ACCESSTRADE_API_TOKEN: ${{ secrets.ACCESSTRADE_API_TOKEN }}
          ACCESSTRADE_SITE_ID: ${{ secrets.ACCESSTRADE_SITE_ID }}
          ACCESSTRADE_CAMPAIGN_ID: ${{ secrets.ACCESSTRADE_CAMPAIGN_ID }}
          SAFE_MODE: "true"
          AUTO_PUBLISH: "true"
        run: python bot_v1.py
      - name: Commit & Push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ result.txt data/ bai-*.html index.html 2>/dev/null || true
          git diff --cached --quiet || (
            git commit -m "Auto update AI product review $(date -u +%Y-%m-%d)" &&
            git push
          )
