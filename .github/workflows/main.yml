name: AI Auto Run

on:
  workflow_dispatch: # Cho phép chạy thủ công để test
  schedule:
    - cron: '0 0 * * *' # Tự động chạy vào 0h00 UTC mỗi ngày

jobs:
  run-ai:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt # Cài từ file txt

      - name: Run Agentic Bot
        env:
          # Truyền API Keys vào môi trường
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bot.py

      - name: Commit & Push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result.txt || true
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto update Agentic AI result $(date -u +%Y-%m-%d)" &&
            git push
          )