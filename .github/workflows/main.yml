name: AI News Boss

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 9 * * *'
    - cron: '0 17 * * *'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run News Boss
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ACCESSTRADE_API_TOKEN: ${{ secrets.ACCESSTRADE_API_TOKEN }}
          ACCESSTRADE_SITE_ID: ${{ secrets.ACCESSTRADE_SITE_ID }}
          ACCESSTRADE_CAMPAIGN_ID: ${{ secrets.ACCESSTRADE_CAMPAIGN_ID }}
          SAFE_MODE: "true"
          AUTO_PUBLISH: "true"
          NEWS_PER_RUN: "1"
        run: python news_bot.py
      - name: Commit generated newspaper
        run: |
          git config user.name "my-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ index.html bai-*.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: publish AI newspaper"
          git push
