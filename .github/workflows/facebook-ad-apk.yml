name: Build Facebook ad APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'facebook-ad-android/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: facebook-ad-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: facebook-ad-debug-apk
          path: facebook-ad-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
