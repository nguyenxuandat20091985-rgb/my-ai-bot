name: AI News Publisher Root

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "index.html"
      - "docs/**"
      - "data/news_fingerprints.json"
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 11 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ai-news-publisher-root
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate newspaper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ACCESSTRADE_API_TOKEN: ${{ secrets.ACCESSTRADE_API_TOKEN }}
          ACCESSTRADE_SITE_ID: ${{ secrets.ACCESSTRADE_SITE_ID }}
          ACCESSTRADE_CAMPAIGN_ID: ${{ secrets.ACCESSTRADE_CAMPAIGN_ID }}
          SAFE_MODE: "true"
          AUTO_PUBLISH: "true"
          NEWS_PER_RUN: "1"
        run: python news_bot.py

      - name: Publish generated root page
        run: |
          test -s docs/index.html
          cp docs/index.html index.html
          test -s index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated newspaper
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy generated newspaper
        id: deployment
        uses: actions/deploy-pages@v4
